[project]
name = "agentic-software-engineering-system"
version = "0.1.0"
description = "Governed local agentic SDLC automation system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<2.13",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=2,<4",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "generated_artifacts", "workspace", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

